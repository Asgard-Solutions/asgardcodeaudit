name: Resolve Phase 1 dependency updates
on:
  push:
    branches: [fix/phase1-completion-20260911]
    paths: [.github/workflows/phase1-dependency-refresh.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update affected development and desktop dependencies
        run: |
          npm --prefix desktop install --save-dev --save-exact electron@44.3.0 esbuild@0.28.2 vitest@4.1.11
          npm --prefix frontend install --save-dev --save-exact vitest@4.1.11 vite@latest @vitejs/plugin-react@latest
          npm --prefix frontend install --save-exact react-router-dom@7.18.3
          npm --prefix frontend update
      - name: Desktop test and build
        working-directory: desktop
        run: |
          npm test
          npm run build
      - name: Frontend test and build
        working-directory: frontend
        env:
          VITE_ASGARD_MODE: desktop
        run: |
          npm test
          node --test tests/preview-transport.node.cjs
          npm run build
      - name: Audit resolved dependencies
        run: |
          npm --prefix desktop audit --audit-level=moderate
          npm --prefix frontend audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-resolved-manifests
          path: |
            desktop/package.json
            desktop/package-lock.json
            frontend/package.json
            frontend/package-lock.json
          retention-days: 7
  publish:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase1-resolved-manifests
          path: resolved
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = 'fix/phase1-completion-20260911';
            const current = await github.rest.repos.getBranch({ owner, repo, branch });
            if (current.data.commit.sha !== context.sha) throw new Error('Branch advanced; refusing to overwrite newer work.');
            const base = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const paths = ['desktop/package.json', 'desktop/package-lock.json', 'frontend/package.json', 'frontend/package-lock.json'];
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: base.data.tree.sha,
              tree: paths.map(path => ({ path, mode: '100644', type: 'blob', content: fs.readFileSync(`resolved/${path}`, 'utf8') })),
            });
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'build: pin tested security updates for the desktop foundation',
              tree: tree.data.sha, parents: [context.sha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false });
