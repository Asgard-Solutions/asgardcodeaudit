name: Phase 1 validation
on:
  push:
    branches: [main, fix/phase1-completion-20260911]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Runtime versions
        run: |
          node --version
          python --version
          uv --version
      - name: Verify backend lock or resolve first delivery
        working-directory: backend
        shell: bash
        run: |
          if test -f uv.lock; then uv lock --check; else uv lock; fi
      - name: Backend tests
        working-directory: backend
        run: uv run --locked --group test python -m pytest tests/ --ignore=tests/test_external_preview.py
      - name: Desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop tests
        working-directory: desktop
        run: npm test
      - name: Desktop build
        working-directory: desktop
        run: npm run build
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Preview transport regression tests
        working-directory: frontend
        run: node --test tests/preview-transport.node.cjs
      - name: Desktop renderer build
        working-directory: frontend
        env:
          VITE_ASGARD_MODE: desktop
        run: npm run build
      - name: Actual Windows Electron foundation
        if: runner.os == 'Windows'
        working-directory: desktop
        run: node tests/run-native-smoke.cjs
      - name: Record dependency advisories
        if: always()
        shell: bash
        run: |
          mkdir -p test_reports/dependencies
          (cd desktop && npm audit --json) > test_reports/dependencies/desktop-audit.json || true
          (cd frontend && npm audit --json) > test_reports/dependencies/frontend-audit.json || true
      - name: Dependency lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-lock-${{ matrix.os }}
          path: backend/uv.lock
          if-no-files-found: error
          retention-days: 7
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-evidence-${{ matrix.os }}
          path: test_reports/
          retention-days: 7
  record-backend-lock:
    needs: foundation
    if: always() && github.ref == 'refs/heads/fix/phase1-completion-20260911'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phase1-lock-windows-latest
          path: generated
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const branch = 'fix/phase1-completion-20260911';
            const current = await github.rest.repos.getBranch({ owner, repo, branch });
            if (current.data.commit.sha !== context.sha) {
              core.notice('Repair branch advanced; do not overwrite newer work.');
              return;
            }
            try {
              await github.rest.repos.getContent({ owner, repo, path: 'backend/uv.lock', ref: branch });
              core.notice('Backend lock already delivered.');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path: 'backend/uv.lock',
              message: 'build: deliver the solver-generated backend dependency lock',
              content: fs.readFileSync('generated/uv.lock').toString('base64'),
            });
